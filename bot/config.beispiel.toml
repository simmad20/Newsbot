# ═══════════════════════════════════════════════════════════════════════════
#  config.toml – Einstellungen des News-Bots (Beispiel mit Testwerten)
# ═══════════════════════════════════════════════════════════════════════════
#
#  So benutzt du diese Datei:
#    1. Kopieren:   cp config.beispiel.toml config.toml      (Windows: copy …)
#    2. In config.toml die Testwerte durch deine echten ersetzen.
#    3. Bot starten. Ohne config.toml startet er nicht („Konfigurationsdatei fehlt“).
#
#  config.toml ist GEHEIM (Bot-Token, API-Schlüssel) und wird nie auf GitHub
#  hochgeladen – das verhindert die .gitignore. Diese Beispieldatei enthält nur
#  Testwerte und darf deshalb im Repository liegen.
#
#  TOML in 30 Sekunden:
#    name = "Text"        Texte immer in Anführungszeichen
#    zahl = 15            Zahlen ohne Anführungszeichen
#    schalter = true      ja/nein: true oder false (klein geschrieben)
#    [abschnitt]          alles darunter gehört zu diesem Abschnitt – bis zum nächsten [ … ]
#    # Kommentar          wird ignoriert
#  Jeder Name darf pro Abschnitt nur einmal vorkommen.
#
#  Pflicht ist nur: Webseite ([dashboard]) ODER Discord. Alles andere hat
#  Standardwerte – die Zeilen dafür kannst du auch weglassen.
# ═══════════════════════════════════════════════════════════════════════════

# ---- Allgemein                 # Gilt ohne Neustart, sobald du die Datei speicherst – auch auf der Webseite änderbar.
discord_webhook = ""             # leer = kein Discord
zeitzone = "Europe/Vienna"       
intervall_minuten = 15           # 5–240
max_alter_stunden = 48           # 1–168
nur_mit_tags = false             
max_meldungen_pro_lauf = 25      # Höchstens so viele Benachrichtigungen pro Prüfung – der Rest kommt bei der nächsten.

# ---- Webseite auf Render
[dashboard]
url = "https://dein-newsbot.onrender.com"
bot_token = "TESTWERT-bitte-durch-den-echten-BOT_TOKEN-ersetzen"
sync_sekunden = 30

# ---- Tags per KI
[llm]
api_key = "sk-TESTWERT-hier-deinen-schluessel-eintragen"
# modell = "deepseek-v4-flash"
# thema = "Cyber und Technologie"
# min_cyber_tags = 3                # so viele Tags aus „Cyber > …“ braucht ein Artikel, sonst aussortiert (0 = aus)