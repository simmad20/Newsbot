# ═══════════════════════════════════════════════════════════════════════════
#  config.toml – Einstellungen des News-Bots (Beispiel mit Testwerten)
# ═══════════════════════════════════════════════════════════════════════════
#
#  So benutzt du diese Datei:
#    1. Kopieren:   cp config.beispiel.toml config.toml      (Windows: copy …)
#    2. In config.toml die Testwerte durch deine echten ersetzen.
#    3. Bot starten. Ohne config.toml startet er nicht („Konfigurationsdatei fehlt“).
#
#  config.toml ist GEHEIM (Bot-Token, API-Schlüssel) und wird nie auf GitHub
#  hochgeladen – das verhindert die .gitignore. Diese Beispieldatei enthält nur
#  Testwerte und darf deshalb im Repository liegen.
#
#  TOML in 30 Sekunden:
#    name = "Text"        Texte immer in Anführungszeichen
#    zahl = 15            Zahlen ohne Anführungszeichen
#    schalter = true      ja/nein: true oder false (klein geschrieben)
#    [abschnitt]          alles darunter gehört zu diesem Abschnitt – bis zum nächsten [ … ]
#    # Kommentar          wird ignoriert
#  Jeder Name darf pro Abschnitt nur einmal vorkommen.
#
#  Pflicht ist nur: Webseite ([dashboard]) ODER Discord. Alles andere hat
#  Standardwerte – die Zeilen dafür kannst du auch weglassen.
#  Die früheren deutschen Namen (z. B. zeitzone, intervall_minuten, denken)
#  funktionieren weiter; stehen beide da, gilt der englische.
# ═══════════════════════════════════════════════════════════════════════════

# ---- General – gilt ohne Neustart, sobald du die Datei speicherst (auch auf der Webseite änderbar)
discord_webhook = ""             # leer = kein Discord
discord_webhook_errors = ""      # eigener Discord-Kanal nur für Fehler (leer = wie oben)
timezone = "Europe/Vienna"
interval_minutes = 15            # wie oft geprüft wird: 5–240
max_age_hours = 48               # wie alt ein Artikel höchstens sein darf: 1–168
only_with_tags = false           # true = Benachrichtigung nur für Artikel mit Tags
max_notifications_per_run = 25   # höchstens so viele Benachrichtigungen pro Prüfung – der Rest kommt bei der nächsten
unchecked_article_days = 7       # nicht abgehakte Artikel nach so vielen Tagen löschen (0 = nie, höchstens 60)

# ---- Webseite auf Render
[dashboard]
url = "https://dein-newsbot.onrender.com"
bot_token = "TESTWERT-bitte-durch-den-echten-BOT_TOKEN-ersetzen"
sync_seconds = 30                # wie oft sich der Bot bei der Seite meldet (mindestens 10)

# ---- Tags per KI
[llm]
api_key = "sk-TESTWERT-hier-deinen-schluessel-eintragen"
min_cyber_tags = 1               # Standard 1: so viele Tags aus „Cyber > …“ braucht ein Artikel, sonst aussortiert (0 = aus)
thinking = false                 # Standard false: true = DeepSeek denkt vor der Antwort nach – gründlicher, aber teurer und langsamer
# provider = "deepseek"          # Standard: am Schlüssel erkannt ("deepseek" oder "anthropic")
# model = "deepseek-v4-flash"    # Standard: deepseek-v4-flash bzw. claude-opus-5-5
# effort = "low"                 # nur Claude: low, medium oder high
# topic = "Cyber and technology" # Standard: Cyber und Technologie (ausführlich); topic = "" schaltet den Themenfilter aus
